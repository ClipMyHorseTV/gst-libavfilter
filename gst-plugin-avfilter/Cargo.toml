[package]
name = "gst-plugin-avfilter"
description = "GStreamer elements wrapping FFmpeg libavfilter filters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "gstavfilter"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
avfilter.workspace = true
gst.workspace = true
gst-base.workspace = true
gst-video.workspace = true

[dev-dependencies]
gst-check.workspace = true

[build-dependencies]
gst-plugin-version-helper = "0.8"

[features]
static = []
capi = []
gpl = []

[package.metadata.capi]
min_version = "0.9.21"

[package.metadata.capi.header]
enabled = false

[package.metadata.capi.library]
install_subdir = "gstreamer-1.0"
versioning = false
import_library = false

[package.metadata.capi.pkg_config]
requires_private = "gstreamer-1.0, gstreamer-base-1.0, gstreamer-video-1.0, gobject-2.0, glib-2.0, gmodule-2.0, libavfilter, libavutil"
